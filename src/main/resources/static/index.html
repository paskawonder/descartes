<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Descartes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Descartes Finest Collection</title>
<meta name="description" content="Descartes’ private map of trusted hotels, restaurants and unique places.">
<meta property="og:title" content="Descartes Finest Collection">
<meta property="og:description" content="Descartes’ private map of trusted hotels, restaurants and unique places.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    /* Descartes palette — built from the wordmark ink */
    --ink: #2D2926;           /* logo colour */
    --ink-soft: #4A4540;
    --paper: #EFE9DF;         /* page / map backdrop */
    --surface: #FAF7F2;       /* panels */
    --surface-sunk: #F3EEE6;
    --line: #E2DACD;
    --line-strong: rgba(45, 41, 38, 0.18);
    --muted: #8A827A;
    --accent: #8C7556;        /* quiet warm bronze for links & active states */
    --ok: #4F6B4A;
    --err: #9B3B2E;
    --radius: 10px;
    --shadow: 0 10px 30px rgba(45, 41, 38, 0.14);
    --gallery-h: 188px;
    --gap: 20px;
  }

  * { box-sizing: border-box; }
  html, body, #map { margin: 0; padding: 0; }
  html { height: 100%; background: var(--paper); }
  body {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    background-color: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .leaflet-container { background: var(--paper); font-family: inherit; }
  /* same tint on the blank-out layer so it matches the map's land exactly */
  .leaflet-tile-pane, .leaflet-greyout-pane { filter: grayscale(0.55) sepia(0.12) contrast(0.95) brightness(1.02); }
  .leaflet-tooltip {
    position: absolute;
    width: max-content;
    max-width: min(320px, calc(100vw - 32px));
    padding: 6px 10px;
    white-space: normal;
    word-break: normal;
    overflow-wrap: break-word;
    line-height: 1.35;
    pointer-events: none;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 15px; font-weight: 600;
    color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow);
  }
  .leaflet-control-zoom a { color: var(--ink) !important; background: var(--surface) !important; border-color: var(--line) !important; }

  /* Interactive menu header */
  #header {
    position: absolute;
    top: var(--gap);
    left: var(--gap);
    z-index: 1000;
    background: transparent;
    border: 0;
    border-radius: var(--radius);
    padding: 18px 24px 14px;
    box-shadow: none;
    cursor: pointer;
  }
  #header:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* Descartes logo: sits above the "Finest Collection" line */
  #header .logo { display: block; width: 190px; max-width: 100%; height: auto; pointer-events: none; -webkit-user-drag: none; user-select: none; }
  #header .tagline {
    display: block;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--line);
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 3.2px;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* Location panel (top right) */
  #panel, #gallery {
    background: var(--surface);
    color: var(--ink);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--line);
    display: none;
  }
  #panel {
    position: absolute;
    top: var(--gap);
    right: var(--gap);
    z-index: 1000;
    width: 360px;
    padding: 24px;
    max-height: calc(100% - var(--gallery-h) - var(--gap) * 3);
    overflow-y: auto;
  }
  #panel h3 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    margin: 0 28px 4px 0;
    font-size: 28px;
    font-weight: 500;
    line-height: 1.1;
    color: var(--ink);
  }
  #panel .meta {
    margin: 0 0 8px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
  }
  #panel .meta:empty { display: none; }
  #panel .coords {
    font-size: 12px;
    color: var(--accent);
    font-weight: 500;
    letter-spacing: 0.4px;
    display: inline-block;
    margin-bottom: 18px;
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }
  #panel .coords:hover { border-bottom-color: var(--accent); }
  #panelActions { display: none; }
  #close, #addClose, #galleryClose {
    position: absolute;
    top: 16px;
    right: 16px;
    border: 0;
    background: none;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    color: var(--muted);
    transition: color 0.2s;
  }
  #close:hover, #addClose:hover, #galleryClose:hover { color: var(--ink); }

  .section-title {
    font-size: 10.5px;
    font-weight: 600;
    margin: 20px 0 10px;
    text-transform: uppercase;
    letter-spacing: 2.4px;
    color: var(--muted);
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
  }

  /* Media gallery — detached strip along the bottom */
  #gallery {
    position: absolute;
    left: var(--gap);
    right: var(--gap);
    bottom: var(--gap);
    z-index: 1000;
    height: var(--gallery-h);
    padding: 14px 20px 16px;
    flex-direction: column;
  }
  #gallery.open { display: flex; }
  #gallery .head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding-right: 30px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
  }
  #gallery .head .section-title { margin: 0; border: 0; padding: 0; }
  #gallery .gallery-title { margin:0; }
  #galleryLoc { flex: 1; min-width: 0; }
  #galleryAddMedia { padding: 6px 10px; font-size: 11px; letter-spacing: 1px; white-space: nowrap; }
  .media-upload-status { font-size: 12px; color: var(--accent); overflow-wrap: anywhere; }
  #galleryUploadStatus:empty { display: none; }
  #galleryLoc {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 17px;
    font-weight: 500;
    color: var(--ink);
    white-space: normal;
    overflow-wrap: anywhere;
  }
  #galleryClose { top: 10px; right: 14px; }
  #media {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: stretch;
    gap: 12px;
    padding: 12px 0 2px;
    overflow-x: auto;
    overflow-y: hidden;
    font-size: 12px;
    color: var(--muted);
  }
  #media .media-item {
    flex: 0 0 auto;
    width: 170px;
    height: 100%;
    border-radius: 6px;
    overflow: hidden;
    background: var(--surface-sunk);
    border: 1px solid var(--line);
    transition: transform 0.2s, box-shadow 0.2s;
    cursor: pointer;
  }
  #media .media-item:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(45, 41, 38, 0.12);
  }
  #media img, #media video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #media .cap {
    padding: 10px;
    font-size: 11px;
    color: var(--ink-soft);
    word-break: break-all;
  }

  /* Upload */
  .upload-box {
    margin-top: 12px;
    background: var(--surface-sunk);
    border: 1px dashed var(--line-strong);
    border-radius: 8px;
    padding: 18px 16px;
    text-align: center;
    transition: background 0.2s, border-color 0.2s;
  }
  .upload-box.dragover { background: #ECE5D9; border-color: var(--accent); }
  .upload-box p { margin: 0 0 12px; font-size: 12px; color: var(--muted); }
  .upload-btn-label, #add button[type=submit] {
    display: inline-block;
    padding: 9px 18px;
    background: var(--ink);
    color: var(--surface);
    border: 0;
    border-radius: 999px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s;
  }
  .upload-btn-label:hover, #add button[type=submit]:hover { background: var(--ink-soft); }
  #media .media-item { position: relative; }
  #media .tag {
    position: absolute; top: 6px; left: 6px; max-width: calc(100% - 12px);
    padding: 3px 8px; border-radius: 999px; background: rgba(250, 247, 242, 0.92);
    color: var(--ink); font-size: 10px; font-weight: 600; letter-spacing: 1px;
    text-transform: uppercase; white-space: normal; overflow-wrap: anywhere;
    pointer-events: none;
  }
  #mediaUploadStatus { display: block; margin-top: 8px; font-size: 11px; color: var(--accent); }

  /* Add location */
  #add {
    position: absolute;
    top: calc(var(--gap) + 118px);              /* sits below the logo so it stays clickable */
    left: var(--gap);
    z-index: 1001;
    width: 360px;
    max-height: calc(100% - var(--gap) * 2 - 118px);
    overflow-y: auto;
    background: var(--surface);
    color: var(--ink);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
    display: none;
    border: 1px solid var(--line);
  }
  #add h3 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    margin: 0 28px 16px 0;
    font-size: 28px;
    font-weight: 500;
  }
  #add label {
    display: block;
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 12px;
  }
  #add input {
    display: block;
    width: 100%;
    margin-top: 6px;
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font: inherit;
    font-size: 13px;
    letter-spacing: 0;
    text-transform: none;
    color: var(--ink);
    background: #FFF;
  }
  #add input:focus { outline: none; border-color: var(--ink); }
  #add button[type=submit] { width: 100%; padding: 12px; }
  #add button:disabled { opacity: .5; cursor: not-allowed; }
  #gmHint {
    display: block;
    min-height: 16px;
    margin: -6px 0 12px;
    font-size: 11px;
    color: var(--muted);
  }
  #gmHint.ok { color: var(--ok); }
  #gmHint.err { color: var(--err); }

  /* Left sidebar: alphabetical location list + add button */
  :root { --side-bottom: var(--gap); }
  body.gallery-open { --side-bottom: calc(var(--gallery-h) + var(--gap) * 2); }
  #sidebar {
    position: absolute;
    left: var(--gap);
    bottom: var(--side-bottom);
    z-index: 1000;
    width: 250px;
    display: none;                              /* hidden until the logo is clicked */
    flex-direction: column;
    gap: 10px;
  }
  body.menu-open #sidebar { display: flex; }
  body.add-open #locBox { display: none; }
  #locBox {
    display: flex;
    flex-direction: column;
    min-height: 0;
    max-height: clamp(120px, calc(100vh - var(--side-bottom) - 220px), 360px);
    padding: 14px 14px 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  #locBox[hidden] { display: none; }
  #locBox .head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
  }
  #locBox .section-title { margin: 0; border: 0; padding: 0; }
  #locCount { font-size: 11px; color: var(--muted); }
  #locList {
    margin: 6px -6px 0;
    padding: 0 6px 6px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-height: 0;
  }
  .loc-btn {
    display: block;
    width: 100%;
    padding: 7px 10px;
    border: 0;
    border-radius: 6px;
    background: none;
    text-align: left;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 17px;
    font-weight: 500;
    color: var(--ink);
    white-space: normal;
    overflow-wrap: anywhere;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .loc-btn:hover { background: var(--surface-sunk); }
  .loc-btn:focus-visible, #addBtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .loc-btn.active { background: var(--ink); color: var(--surface); }
  .loc-btn.unnamed { font-style: italic; color: var(--muted); }
  .loc-btn.unnamed.active { color: var(--surface); }
  .country > summary {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 6px;
    list-style: none;
    cursor: pointer;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .country > summary::-webkit-details-marker { display: none; }
  .country > summary::before { content: '›'; font-size: 14px; line-height: 1; transition: transform 0.15s; }
  .country[open] > summary::before { transform: rotate(90deg); }
  .country > summary:hover { background: var(--surface-sunk); }
  .country > summary .n { margin-left: auto; font-weight: 500; letter-spacing: 0; color: var(--muted); }
  .country .locs { list-style: none; margin: 0; padding: 0 0 4px 12px; }
  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    z-index: 3000; padding: 10px 16px; border-radius: 999px;
    background: var(--ink); color: var(--surface); font-size: 12px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  #toast.show { opacity: 1; }
  #addBtn {
    width: 100%;
    padding: 12px 18px;
    border: 0;
    border-radius: 999px;
    background: var(--ink);
    color: var(--surface);
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: background 0.2s;
  }
  #addBtn:hover { background: var(--ink-soft); }


  /* ===== Finest Collection: intro, toolbar, list view, card ===== */
  #header .intro { display:block; max-width:250px; margin-top:8px; font-size:11px; line-height:1.5; color:var(--muted); }
  #toolbar { display:none; position:absolute; top:var(--gap); left:360px; right:400px; z-index:1002; flex-wrap:wrap; gap:8px; align-items:center; }
  body.menu-open #toolbar { display:flex; }
  #toolbar input { flex:1 1 180px; min-width:0; padding:10px 14px; border:1px solid var(--line); border-radius:999px; background:var(--surface); font:inherit; font-size:13px; color:var(--ink); box-shadow:var(--shadow); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { padding:8px 13px; border:1px solid var(--line); border-radius:999px; background:var(--surface); font:inherit; font-size:10.5px; font-weight:600; letter-spacing:1.4px; text-transform:uppercase; color:var(--ink); cursor:pointer; }
  .chip.on { background:var(--ink); color:var(--surface); border-color:var(--ink); }
  /* popup dropdowns: same pill design as the chips, options pop up as chips */
  .dd { position:relative; display:inline-block; max-width:100%; }
  .dd-btn { display:inline-flex; align-items:center; gap:9px; max-width:100%; white-space:normal; }
  .dd-btn .dd-txt { overflow-wrap:anywhere; }
  .dd-btn::after { content:''; flex:none; width:5px; height:5px; margin-top:-3px; border-right:1.5px solid currentColor; border-bottom:1.5px solid currentColor; transform:rotate(45deg); transition:transform .15s; }
  .dd-btn[aria-expanded="true"]::after { margin-top:3px; transform:rotate(-135deg); }
  .dd-btn:focus-visible, .dd-pop .chip:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
  .dd-pop { position:fixed; z-index:3000; display:flex; flex-wrap:wrap; align-content:flex-start; gap:6px; box-sizing:border-box; width:max-content; max-width:min(440px, calc(100vw - 16px)); max-height:min(60vh, 380px); overflow-y:auto; padding:12px; border:1px solid var(--line); border-radius:var(--radius, 14px); background:var(--surface); box-shadow:var(--shadow); transform-origin:var(--ddo, top left); animation:ddIn .16s ease-out; }
  .dd-pop.out { animation:ddOut .12s ease-in forwards; pointer-events:none; }
  @keyframes ddIn { from { opacity:0; transform:scale(.92); } }
  @keyframes ddOut { to { opacity:0; transform:scale(.92); } }
  @media (prefers-reduced-motion: reduce) { .dd-pop, .dd-pop.out { animation:none; } }
  #listView { display:none; position:fixed; inset:0; z-index:999; overflow-y:auto; padding:150px var(--gap) 40px 290px; background:var(--bg, #EFE9DF); }
  body.view-list #listView { display:block; }
  body.view-list .leaflet-control-container { display:none; }
  .fbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:18px; }
  .fbar select { padding:9px 12px; border:1px solid var(--line); border-radius:999px; background:var(--surface); font:inherit; font-size:12px; color:var(--ink); }
  .fbar .btn { padding:9px 16px; }
  #listView .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
  .lcard { padding:18px; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); text-align:left; font:inherit; color:var(--ink); cursor:pointer; box-shadow:var(--shadow); }
  .lcard:hover { border-color:var(--ink); }
  .lcard b { display:block; font-family:'Cormorant Garamond',Georgia,serif; font-size:21px; font-weight:600; }
  .lcard span { display:block; margin-top:4px; font-size:12px; color:var(--muted); }
  #card { display:none; position:fixed; inset:0; z-index:1500; overflow-y:auto; background:var(--bg, #EFE9DF); }
  #card.open { display:block; }
  #cardClose { position:fixed; top:42px; right:max(20px, calc((100vw - 980px) / 2 + 20px)); z-index:1; padding:0 4px; border:0; background:transparent; color:var(--ink); font:inherit; font-size:40px; line-height:1; cursor:pointer; }
  #cardClose:hover { color:var(--accent); }
  #cardClose:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  #card .sheet { max-width:980px; margin:0 auto; padding:56px 20px 60px; }
  #card h2 { margin:0; font-family:'Cormorant Garamond',Georgia,serif; font-size:40px; font-weight:600; }
  #card .card-name { display:block; width:100%; margin:0; padding:0; border:0; border-radius:0; background:transparent; color:var(--ink); font:600 40px 'Cormorant Garamond',Georgia,serif; }
  #card .card-name:focus { outline:2px solid var(--accent); outline-offset:3px; }
  #card .sub { margin:6px 0 16px; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); }
  #card .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:26px; }
  #card .row a { font-size:12px; color:var(--ink); }
  #card .blk { margin-bottom:20px; }
  #card .blk h4 { margin:0 0 6px; font-size:10.5px; font-weight:600; letter-spacing:2px; text-transform:uppercase; color:var(--muted); }
  #card .blk p { margin:0; white-space:pre-wrap; line-height:1.6; }
  #card .tags span { display:inline-block; margin:0 6px 6px 0; padding:4px 11px; border:1px solid var(--line); border-radius:999px; font-size:12px; }
  #card input, #card textarea, #card select { width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:6px; background:#FFF; font:inherit; font-size:13px; color:var(--ink); }
  #card textarea { min-height:70px; resize:vertical; }
  .btn { padding:11px 20px; border:0; border-radius:999px; background:var(--ink); color:var(--surface); font:inherit; font-size:11px; font-weight:600; letter-spacing:1.6px; text-transform:uppercase; cursor:pointer; }
  .btn.ghost { background:none; color:var(--ink); border:1px solid var(--ink); }
  #card .tabs { margin:8px 0 14px; }
  #card .photos { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
  #card .ph { position:relative; width:100%; min-width:0; border-radius:8px; overflow:hidden; background:var(--surface); border:1px solid var(--line); }
  #card .ph img, #card .ph video { display:block; width:100%; aspect-ratio:4/3; object-fit:cover; cursor:zoom-in; }
  #card .ph .cap { padding:6px 10px; font-size:12px; color:var(--muted); }
  #card .ph .star { position:absolute; top:6px; right:6px; padding:2px 8px; border-radius:999px; background:var(--ink); color:var(--surface); font-size:10px; }
  #card .ph .ctl { display:flex; flex-wrap:wrap; gap:4px; padding:6px; border-top:1px solid var(--line); }
  #card .ph .ctl button { padding:3px 8px; border:1px solid var(--line); border-radius:6px; background:#FFF; font-size:12px; cursor:pointer; }
  #card .ph .download { display:inline-flex; margin:6px; padding:6px 10px; font-size:10px; text-decoration:none; }
  @media (max-width:1100px) { #toolbar { top:calc(var(--gap) + 125px); left:var(--gap); right:var(--gap); } #listView { padding:200px 16px 40px; } }
  @media (max-width:700px) { #card h2, #card .card-name { font-size:30px; margin-right:48px; } #card .sheet { padding-top:36px; } #cardClose { top:22px; right:16px; } #toolbar { top:110px; } }

<style id="ios-upgrade">
/* ===================================================================
   iPhone upgrade (Pro Max class: ~440 x 956 pt, Dynamic Island, home indicator)

:root {
  --sat: env(safe-area-inset-top, 0px);

  --sar: env(safe-area-inset-right, 0px);

  --top-stack: 96px;       /* bottom edge of the header, set from JS */
}
html { -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
html, body { overflow: hidden; }
/* Fixed, full-bleed layout: the map always fills the screen even while Safari's bars collapse/expand */
body { position: fixed; top: 0; right: 0; bottom: 0; left: 0; width: auto; height: auto; -webkit-tap-highlight-color: transparent; }
#map { position: fixed; top: 0; right: 0; bottom: 0; left: 0; width: auto; height: auto; margin: 0; padding: 0; border: 0; border-radius: 0; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
/* Edge-to-edge: 100lvh is the viewport with Safari's toolbars collapsed, so the map also fills the strips behind the
   (translucent) status bar and bottom toolbar instead of leaving paper-coloured margins. Older browsers keep the inset:0 sizing above. */
:root { --lv-gap: 0px; }   /* map area hidden under the browser's bottom toolbar */
@supports (height: 100lvh) { :root { --lv-gap: max(0px, calc(100lvh - 100dvh)); } #map { bottom: auto; height: 100lvh; min-height: 100%; } }
/* Full-bleed map: edges (top/right/bottom/left = 0) define its size, with no explicit height.
   A 100dvh height stopped short of the screen edges and left paper-coloured strips at the top and bottom.
   The map now runs under the status bar and home indicator; only the controls respect the safe areas. */
.leaflet-bottom { margin-bottom: calc(var(--sab) + var(--lv-gap)); }
.leaflet-left { margin-left: var(--sal); }
.leaflet-right { margin-right: var(--sar); }
/* Landscape home-screen devices can be wider than the phone breakpoint. */
@media (min-width: 701px) and (pointer: coarse) {
  #header { top: calc(var(--sat) + var(--gap)); left: calc(var(--sal) + var(--gap)); }
  #toolbar { top: calc(var(--sat) + var(--gap)); left: calc(var(--sal) + 360px); right: calc(var(--sar) + 400px); }
  #panel { top: calc(var(--sat) + var(--gap)); right: calc(var(--sar) + var(--gap)); max-height: calc(100% - var(--sat) - var(--sab) - var(--gallery-h) - var(--gap) * 3); }
  #sidebar { left: calc(var(--sal) + var(--gap)); bottom: calc(var(--sab) + var(--side-bottom)); }
  #gallery { left: calc(var(--sal) + var(--gap)); right: calc(var(--sar) + var(--gap)); bottom: calc(var(--sab) + var(--gap)); }
  #add { top: calc(var(--sat) + var(--gap) + 118px); left: calc(var(--sal) + var(--gap)); max-height: calc(100% - var(--sat) - var(--sab) - var(--gap) * 2 - 118px); }
  #card .sheet { padding-top: calc(var(--sat) + 56px); padding-bottom: calc(var(--sab) + 60px); }
  #cardClose { top: calc(var(--sat) + 12px); right: calc(var(--sar) + 20px); }
  #lightboxClose { top: calc(var(--sat) + 20px); right: calc(var(--sar) + 20px); }
  #lbCount { bottom: calc(var(--sab) + 16px); }
}
button, .chip, .btn, summary, a, label { touch-action: manipulation; }
#header, .chip, .btn, button, .lcard { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#card .photos img, #lightbox img { -webkit-touch-callout: default; }
:focus-visible { outline-color: var(--accent); }

/* Floating round buttons (phone only) */
#mBtn, #fitBtn {
  display: none; position: fixed; z-index: 1003; width: 46px; height: 46px; padding: 0;
  align-items: center; justify-content: center; border-radius: 50%;
  border: 1px solid var(--line); background: rgba(250, 247, 242, .94); color: var(--ink);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: var(--shadow); cursor: pointer;
}
#mBtn svg, #fitBtn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
#mBtn .x { display: none; }
body.menu-open #mBtn { background: var(--ink); color: var(--surface); border-color: var(--ink); }
body.menu-open #mBtn .x { display: block; }

#mBtn:active, #fitBtn:active { transform: scale(.94); }
#fitBtn { z-index: 1001; }
body.gallery-open #fitBtn, body.add-open #fitBtn, body.view-list #fitBtn { display: none !important; }

/* Touch devices: no hover tooltips (they stick after a tap and cover the sheet) */
@media (hover: none) {
  .leaflet-tooltip { display: none !important; }

  .lcard:hover { border-color: var(--line); }
}

  root.querySelectorAll('video').forEach(v => {
    if (vio) vio.unobserve(v);
    try { v.pause(); } catch (e) {}
    v.removeAttribute('src'); v.load();
  });
  root.querySelectorAll('img').forEach(i => i.removeAttribute('src'));
}
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseMedia(document); });

let galleryAbort = null;
async function loadMedia(locationId) {
  const seq = ++galleryLoadSeq;
  const isCurrent = () => seq === galleryLoadSeq && String(currentLocId) === String(locationId);
  if (galleryAbort) galleryAbort.abort();
  const ctl = galleryAbort = new AbortController();
  const box = $('media');
  releaseMedia(box);
  box.textContent = 'Loading gallery';
  try {
    const items = normalizeMedia(await getJson(`/api/locations/${encodeURIComponent(locationId)}/media`, ctl.signal));
    if (!isCurrent()) return;
    box.replaceChildren();
    if (!items.length) {
      box.textContent = 'No media assets found for this location.';
      return;
    }
    const urls = [];   // images of this strip, in strip order, for the lightbox
    items.forEach(item => {
      const href = safeUrl(item.url);
      const div = document.createElement('div');
      div.className = 'media-item';

      if (href && /\.(png|jpe?g|gif|webp|avif|svg)(\?|#|$)/i.test(href)) {
        const img = document.createElement('img');
        img.src = href;
        img.loading = 'lazy';
        img.decoding = 'async';
        const n = urls.push(href) - 1;
        img.onclick = () => { lbImages = urls; showLightbox(n); };
        div.append(img);
      } else if (href && /\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(href)) {
        div.append(lazyVideo(href));
      } else {
        const cap = document.createElement('div');
        cap.className = 'cap';
        cap.textContent = href || item.url;
        if (href) div.onclick = () => window.open(href, '_blank', 'noopener,noreferrer');
        div.append(cap);
      }
      if (item[F.category]) {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = item[F.category];
        div.append(tag);
      }
      box.append(div);
    });
  } catch (e) {
    if (e.name !== 'AbortError' && isCurrent()) box.textContent = 'Could not load gallery: ' + e.message;
  }
}

/* S3 upload: API gives a presigned PUT URL -> browser PUTs the file to S3 -> API stores the media record */
const MAX_UPLOAD_MB = 200;
let mediaUploadStatus = '';

async function errorText(res) {
  let m = res.status + ' ' + res.statusText;
  try { const p = await res.json(); m = p.detail || p.message || m; } catch (e) {}
  return m;
}

async function createMediaRecord(url, id = uuid(), locId = currentLocId, reload = true, category = 'General') {
  if (!locId) return;
  const media = mediaPayload({ id, url, [F.category]: category });
  const res = await fetch(`${API}/api/locations/${encodeURIComponent(locId)}/media`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
    body: JSON.stringify(media)
  });
  if (!res.ok) throw new Error(await errorText(res));
  if (reload && locId === currentLocId) await loadMedia(locId);
}

function putToS3(url, file, type, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', url);
    xhr.setRequestHeader('Content-Type', type); // must match the type that was signed
    xhr.upload.onprogress = e => e.lengthComputable && onProgress(Math.round(e.loaded / e.total * 100));
    xhr.onload = () => xhr.status >= 200 && xhr.status < 300 ? resolve() : reject(new Error('S3 rejected the upload (' + xhr.status + ')'));
    xhr.onerror = () => reject(new Error('Could not reach S3 (check the bucket CORS rule)'));
    xhr.send(file);
  });
}

const MAX_FILES = 10, PARALLEL = 3;
let uploading = false;

async function uploadOne(file, locId, category, onProgress) {
  file = await compress(file);
  if (!/^(image|video)\//.test(file.type)) throw new Error('only images and videos are supported');
  if (file.size > MAX_UPLOAD_MB * 1024 * 1024) throw new Error('larger than ' + MAX_UPLOAD_MB + ' MB');
  const res = await fetch(`${API}/api/locations/${encodeURIComponent(locId)}/media/upload-url`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
    body: JSON.stringify({ fileName: file.name, contentType: file.type })
  });
  if (!res.ok) throw new Error(await errorText(res));
  const slot = await res.json();
  await putToS3(slot.uploadUrl, file, file.type, onProgress);
  await createMediaRecord(slot.publicUrl, slot.mediaId, locId, false, category);
}

async function handleFiles(fileList, category = 'General') {
  if (!currentLocId || !fileList || !fileList.length) return false;
  if (uploading) { mediaUploadStatus = 'An upload is already running.'; drawCard(); return false; }
  let files = Array.from(fileList), note = '';
  if (files.length > MAX_FILES) { note = ' (only the first ' + MAX_FILES + ' files were used)'; files = files.slice(0, MAX_FILES); }

  uploading = true;
  const locId = currentLocId, progress = files.map(() => 0), failed = [];
  let done = 0;
  const render = () => {
    mediaUploadStatus = 'Uploading ' + done + ' of ' + files.length + ' files, ' +
      Math.round(progress.reduce((x, y) => x + y, 0) / files.length) + '%';
    document.querySelectorAll('.media-upload-status').forEach(status => { status.textContent = mediaUploadStatus; });
  };
  render();
  const queue = files.map((f, i) => i);
  const worker = async () => {
    while (queue.length) {
      const i = queue.shift();
      try { await uploadOne(files[i], locId, category, p => { progress[i] = p; render(); }); }
      catch (err) { failed.push(files[i].name + ': ' + err.message); }
      progress[i] = 100; done++; render();
    }
  };
  try {
    await Promise.all(Array.from({ length: Math.min(PARALLEL, files.length) }, worker));
  } finally { uploading = false; }
  const ok = files.length - failed.length;
  mediaUploadStatus = 'Uploaded ' + ok + ' of ' + files.length + ' file' + (files.length === 1 ? '' : 's') + note +
    (failed.length ? '. Failed: ' + failed.join('; ') : '');
  mediaDirty = true;
  if (locId === cardId) await loadCardMedia();
  else if (locId === currentLocId) await loadMedia(locId);
  document.querySelectorAll('.media-upload-status').forEach(status => { status.textContent = mediaUploadStatus; });
  return ok === files.length;
}

/* Google Maps Link Parsing & Add Location */
let draftMarker = null;
let nameEdited = false;

function parseMapsLink(input) {
  let t = input.trim(), url;
  try {
    url = new URL(t);
    if (!['http:', 'https:'].includes(url.protocol)
        || !['google.com', 'www.google.com', 'maps.google.com'].includes(url.hostname.toLowerCase())) return null;
  } catch (e) { return null; }
  try { t = decodeURIComponent(t); } catch (e) {}
  const N = '(-?\\d{1,3}(?:\\.\\d+)?)';
  const patterns = [
    new RegExp('!3d' + N + '!4d' + N),
    new RegExp('[?&](?:q|ll|query|center|destination|daddr)=' + N + '\\s*,\\s*' + N),
    new RegExp('@' + N + ',' + N)
  ];
  for (const re of patterns) {
    const m = t.match(re);
    if (!m) continue;
    const lat = parseFloat(m[1]), lon = parseFloat(m[2]);
    if (lat < -90 || lat > 90 || lon < -180 || lon > 180) continue;
    const place = t.match(/\/maps\/place\/([^/@?]+)/);
    return { lat, lon, name: place ? place[1].replace(/\+/g, ' ').trim() : '' };
  }
  return null;
}

/* country / region / venue website from coordinates (OpenStreetMap Nominatim; website only when OSM knows the venue) */
let geoSeq = 0;
async function geo(lat, lon) {
  const seq = ++geoSeq;
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&extratags=1&zoom=18&accept-language=en&lat=${lat}&lon=${lon}`, { headers: { Accept: 'application/json' } });
    if (!res.ok) return;
    const j = await res.json();
    if (seq !== geoSeq || !draft) return;
    const a = j.address || {}, x = j.extratags || {};
    draft.country = a.country || draft.country;
    draft.region = a.state || a.region || a.province || a.county || draft.region;
    draft.website = x.website || x['contact:website'] || x.url || draft.website;
    if (!draft.name) {
      draft.name = j.name || String(j.display_name || '').split(',')[0].trim();
      if (!nameEdited) $('gmName').value = draft.name;
    }
  } catch (e) {}
}

function applyResolved(r) {
  setDraft(r.lat, r.lon, r.name);
  Object.assign(draft, { country: r.country || '', region: r.region || '', website: r.website || '' });
  map.panTo([r.lat, r.lon]);
  hint(`Found coordinates: ${r.lat}, ${r.lon}`, 'ok');
}

$('gmName').addEventListener('input', () => {
  nameEdited = true;
  if (draft) draft.name = $('gmName').value.trim();
 });

let pendingGeo = Promise.resolve();
$('gmLink').addEventListener('input', () => {
  const v = $('gmLink').value.trim();
  pendingGeo = Promise.resolve();
  if (!v) { draft = null; return hint(''); }
  const r = parseMapsLink(v);
  if (r) { applyResolved(r); pendingGeo = geo(r.lat, r.lon); return; }
  draft = null;
  return hint('Paste the full Google Maps URL containing coordinates. Short links are not supported.', 'err');
});

$('add').onsubmit = async ev => {
  ev.preventDefault();
  if (!draft) return hint('Paste a valid Google Maps link first', 'err');
  const pendingDraft = draft;
  $('addSave').disabled = true;
  try {
    await pendingGeo;
    if (draft !== pendingDraft) return;
    const resolved = { ...pendingDraft };
    const body = locationPayload({
      id: uuid(), name: resolved.name || `Location ${resolved.lat.toFixed(5)}, ${resolved.lon.toFixed(5)}`,
      lat: resolved.lat, lon: resolved.lon, [F.country]: resolved.country,
      region: resolved.region, website: resolved.website, [F.link]: $('gmLink').value.trim()
    });
    const res = await fetch(API + '/api/locations', {
      method: 'POST',
      body: JSON.stringify(body),
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' }
    });
    if (!res.ok) {
      let msg = res.status + ' ' + res.statusText;
      try { const p = await res.json(); msg = p.detail || p.message || msg; } catch (e) {}
      throw new Error(msg);
    }
    const loc = expandLocation(Object.assign({}, await res.json().catch(() => ({})), body));
    closeAdd();
    showPanel(loc, addCircle(loc));
  } catch (e) {
    hint('Could not save location: ' + e.message, 'err');
  } finally {
    $('addSave').disabled = false;
  }
};

/* popup dropdown: click -> options pop up as chips; closes on choose, outside click, Esc, scroll or resize */
let ddOpen = null;
function ddClose(focusBtn) {
  const d = ddOpen; if (!d) return; ddOpen = null;
  document.removeEventListener('pointerdown', d.away, true); document.removeEventListener('keydown', d.key, true);
  window.removeEventListener('resize', d.close); window.removeEventListener('scroll', d.scroll, true);
  d.btn.setAttribute('aria-expanded', 'false');
  d.pop.classList.add('out'); setTimeout(() => d.pop.remove(), 120);
  if (focusBtn) d.btn.focus();
}
function dropdown({ id, options, value = '', prefix = '', placeholder = 'Choose', highlight = false, onchange }) {
  let cur = value;
  const label = () => { const o = options.find(o => o.value === cur); return prefix ? prefix + ': ' + (o ? o.label : 'all') : (o && cur !== '' ? o.label : placeholder); };
  const txt = h('span', { className: 'dd-txt' }), btn = h('button', { type: 'button', className: 'chip dd-btn' }, txt);
  btn.setAttribute('aria-haspopup', 'listbox'); btn.setAttribute('aria-expanded', 'false');
  const wrap = h('div', { className: 'dd' }, btn); if (id) wrap.id = id;
  const paint = () => { txt.textContent = label(); btn.classList.toggle('on', highlight && cur !== ''); };
  Object.defineProperty(wrap, 'value', { get: () => cur, set: v => { cur = v; paint(); } });
  paint();
  const pick = v => { cur = v; paint(); ddClose(true); if (onchange) onchange(v); };
  btn.onclick = () => {
    if (ddOpen && ddOpen.btn === btn) return ddClose(true);
    ddClose();
    const pop = h('div', { className: 'dd-pop' }, ...options.map(o => { const c = h('button', { type: 'button', className: 'chip' + (o.value === cur ? ' on' : ''), textContent: o.label, onclick: () => pick(o.value) }); c.setAttribute('role', 'option'); c.setAttribute('aria-selected', String(o.value === cur)); return c; }));
    pop.setAttribute('role', 'listbox');
    document.body.append(pop);
    const r = btn.getBoundingClientRect(), w = pop.offsetWidth, ph = pop.offsetHeight, vw = innerWidth, vh = innerHeight;
    const left = Math.max(8, Math.min(r.left, vw - w - 8)), below = vh - r.bottom - 12, above = r.top - 12, up = ph > below && above > below;
    pop.style.left = left + 'px'; pop.style.top = (up ? Math.max(8, r.top - 6 - ph) : r.bottom + 6) + 'px';
    pop.style.setProperty('--ddo', (up ? 'bottom ' : 'top ') + Math.max(0, r.left - left) + 'px');
    btn.setAttribute('aria-expanded', 'true');
    const d = ddOpen = { btn, pop, close: () => ddClose(),
      away: e => { if (!pop.contains(e.target) && !btn.contains(e.target)) ddClose(); },
      scroll: e => { if (!pop.contains(e.target)) ddClose(); },
      key: e => { if (e.key === 'Escape') { e.stopImmediatePropagation(); e.preventDefault(); ddClose(true); } } };
    document.addEventListener('pointerdown', d.away, true); document.addEventListener('keydown', d.key, true);
    window.addEventListener('resize', d.close); window.addEventListener('scroll', d.scroll, true);
    (pop.querySelector('.on') || pop.firstChild).focus({ preventScroll: true });
  };
  return wrap;
}
async function call(method, path, body) {
  try { return (await fetch(API + path, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined })).ok; }
  catch (e) { return false; }
}

/* 7. photo viewer: swipe left/right to browse, swipe down to close, pinch to zoom */
(function () {
  const lb = $('lightbox'), img = $('lightboxImg'); let sx, sy, dx = 0, dy = 0, on = false;
  lb.addEventListener('touchstart', e => {
    if (e.touches.length !== 1 || (vv && vv.scale > 1.05)) { on = false; return; }
    on = true; sx = e.touches[0].clientX; sy = e.touches[0].clientY; dx = dy = 0; img.style.transition = 'none';
  }, { passive: true });
  lb.addEventListener('touchmove', e => {
    if (!on) return;
    if (e.touches.length > 1) { on = false; img.style.transform = ''; return; }
    dx = e.touches[0].clientX - sx; dy = e.touches[0].clientY - sy;
    if (Math.abs(dy) > Math.abs(dx)) { img.style.transform = 'translateY(' + dy + 'px)'; lb.style.background = 'rgba(239,233,223,' + Math.max(.35, .97 - Math.abs(dy) / 520) + ')'; }
    else img.style.transform = 'translateX(' + dx + 'px)';
  }, { passive: true });
  const end = () => {
    if (!on) return; on = false;
    img.style.transition = 'transform .2s ease'; lb.style.background = '';
    if (Math.abs(dy) > 110 && Math.abs(dy) > Math.abs(dx)) closeLightbox();
    else if (Math.abs(dx) > 60 && lbImages.length > 1) showLightbox(lbIndex + (dx < 0 ? 1 : -1));
    img.style.transform = '';
  };
  lb.addEventListener('touchend', end, { passive: true });
  lb.addEventListener('touchcancel', end, { passive: true });
})();

init().then(routeFromHash).then(() => { map.invalidateSize({ pan: false }); if (!cardId) fitAll(false); });
